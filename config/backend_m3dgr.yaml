# LIVO Backend Configuration for M3DGR Dataset

# ============================================================
# Topic names
# ============================================================
livo_odom_topic: "/aft_mapped_to_init"
gnss_topic: "/mavros/global_position/raw/fix"
wheel_topic: "/odom"

# ============================================================
# Keyframe selection
# ============================================================
keyframe_skip: 5
keyframe_distance_threshold: 0.5
keyframe_angle_threshold: 0.3

# ============================================================
# Sensor factor enable flags
#   Set true to enable, false to disable each module
# ============================================================
enable_gnss: true
enable_wheel: true
enable_loop_closure: true
enable_loop_distance: false    # 兼容旧模块，建议关闭

# ============================================================
# Noise covariances (shared level)
# ============================================================
noise:
  livox_pos_cov: 0.01
  livox_rot_cov: 0.001
  gnss_pos_cov: 25.0
  wheel_pos_cov: 0.5
  wheel_rot_cov: 0.1

# ============================================================
# Per-module parameters
# ============================================================
gnss_module:
  gnss_pos_cov: 25.0
  time_tolerance: 0.5
  transform_update_interval: 50
  min_correspondences: 20

wheel_module:
  wheel_pos_cov: 0.5
  wheel_rot_cov: 0.1
  time_tolerance: 0.2

loop_distance_module:
  search_radius: 5.0        # 回环搜索半径（米）
  loop_pos_cov: 0.5         # 回环平移噪声
  loop_rot_cov: 0.1         # 回环旋转噪声
  min_keyframe_gap: 50      # 回环最小帧间隔，避免连续帧误检
  max_keyframe_gap: 500     # 回环最大帧间隔

loop_closure:
  mode: "hybrid_a"          # 可切换: hybrid_a / visual_b / frontend_c
  image_topic: "/rgb_img"
  cloud_topic: "/cloud_registered"
  image_buffer_size: 40
  cloud_buffer_size: 20
  image_time_tolerance: 0.15
  cloud_time_tolerance: 0.15
  image_resize_scale: 0.5
  orb_features: 800
  detection_interval: 5
  top_k_candidates: 5
  min_keyframe_gap: 40
  max_keyframe_gap: 600
  min_orb_matches: 30
  min_orb_inliers: 20
  min_visual_score: 0.08
  scan_context_rings: 20
  scan_context_sectors: 60
  scan_context_max_radius: 40.0
  scan_context_distance_threshold: 0.35
  cloud_voxel_size: 0.4
  icp_max_corr_distance: 2.0
  icp_fitness_threshold: 0.6
  loop_pos_cov: 0.3
  loop_rot_cov: 0.05

# ============================================================
# Output files
# ============================================================
output:
  trajectory_file: "Log/backend_optimized_traj.txt"
  optimized_path: "Log/backend_optimized_path.txt"
