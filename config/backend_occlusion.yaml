# LIVO Backend Configuration for M3DGR Occlusion01.bag
#
# 数据集特点: 遮挡场景，有 LiDAR + IMU + Camera + 轮速计，可用于测试
# FAST-LIVO2 前端在局部可观测性变差时，wheel 松耦合后端能否提供额外稳定性。
#
# rosbag info Occlusion01.bag:
#   /livox/mid360/lidar                    1425 msgs
#   /livox/mid360/imu                     28492 msgs
#   /camera/color/image_raw/compressed     4270 msgs
#   /odom                                  2849 msgs   <- 轮速计 (nav_msgs/Odometry)
#   /vrpn_client_node/UGV/pose             2848 msgs   <- 可作为独立评估参考
#   [无 GNSS topic]

# ============================================================
# Topic names
# ============================================================
livo_odom_topic: "/aft_mapped_to_init"
gnss_topic: "/mavros/global_position/raw/fix"   # Occlusion01 中没有 GNSS，保留默认占位
wheel_topic: "/odom"

# ============================================================
# Keyframe selection
# ============================================================
keyframe_skip: 5
keyframe_distance_threshold: 0.5
keyframe_angle_threshold: 0.3

# ============================================================
# Sensor factor enable flags
# ============================================================
enable_gnss: false
enable_wheel: true
enable_loop_closure: true
enable_loop_distance: false

# ============================================================
# Noise covariances (shared level)
# ============================================================
noise:
  livox_pos_cov: 0.01
  livox_rot_cov: 0.001
  gnss_pos_cov: 25.0
  wheel_pos_cov: 0.5
  wheel_rot_cov: 0.1

# ============================================================
# Per-module parameters
# ============================================================
gnss_module:
  gnss_pos_cov: 25.0
  time_tolerance: 0.5
  transform_update_interval: 50
  min_correspondences: 20

wheel_module:
  wheel_pos_cov: 0.5
  wheel_rot_cov: 0.1
  time_tolerance: 0.2

loop_distance_module:
  # 遮挡 + 重复结构场景先禁用回环，若后续确认轨迹有明显回返且无误检，再打开
  search_radius: 3.0
  loop_pos_cov: 0.5
  loop_rot_cov: 0.1
  min_keyframe_gap: 20
  max_keyframe_gap: 300

loop_closure:
  mode: "hybrid_a"
  image_topic: "/rgb_img"
  cloud_topic: "/cloud_registered"
  image_buffer_size: 40
  cloud_buffer_size: 20
  image_time_tolerance: 0.15
  cloud_time_tolerance: 0.15
  image_resize_scale: 0.5
  orb_features: 800
  detection_interval: 5
  top_k_candidates: 5
  min_keyframe_gap: 30
  max_keyframe_gap: 400
  min_orb_matches: 40
  min_orb_inliers: 25
  min_visual_score: 0.10
  require_both_modalities: false
  min_fused_score: 0.82
  scan_context_rings: 20
  scan_context_sectors: 60
  scan_context_max_radius: 35.0
  scan_context_distance_threshold: 0.22
  cloud_voxel_size: 0.4
  icp_max_corr_distance: 1.8
  icp_fitness_threshold: 0.22
  min_icp_cloud_points: 30
  max_livo_loop_distance: 1.5
  max_gicp_translation_delta: 0.6
  max_gicp_rotation_delta_deg: 8.0
  loop_pos_cov: 0.3
  loop_rot_cov: 0.05

# ============================================================
# Output files
# ============================================================
output:
  trajectory_file: "Log/backend_optimized_traj_occlusion.txt"
  optimized_path: "Log/backend_optimized_path_occlusion.txt"
